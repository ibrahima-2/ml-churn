global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: "ml-churn-api"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "api:8000"   # nom du service docker-compose

  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"
