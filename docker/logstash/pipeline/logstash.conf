# Pipeline Logstash : logs JSON de l'API -> Elasticsearch
#
# L'API écrit une ligne JSON par événement dans /app/logs/api.log
# (volume Docker "api-logs", monté ici en lecture seule sur /logs).

input {
  file {
    path => ["/logs/api.log"]
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb-api"
    codec => "json"
    mode => "tail"
  }
}

filter {
  # Horodatage de l'événement = horodatage écrit par l'API (et non l'heure de lecture)
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
    remove_field => ["timestamp"]
  }

  # Lignes non JSON (ne devrait pas arriver) : on les garde mais on les marque
  if "_jsonparsefailure" in [tags] {
    mutate { add_field => { "level" => "UNKNOWN" } }
  }

  mutate {
    convert => {
      "duration_ms"      => "float"
      "response_time_ms" => "float"
      "probability"      => "float"
      "status_code"      => "integer"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "ml-churn-logs-%{+YYYY.MM.dd}"
  }
}
