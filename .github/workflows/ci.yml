name: CI ML Churn

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  # 1. Pipeline Data Science + tests unitaires / API
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installation
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Correction : on vérifie que le pipeline data -> modèle est reproductible
      - name: Génération des données
        run: python src/generate_data.py

      - name: Entraînement du modèle
        run: python src/train.py

      # Correction : les tests Selenium sont ignorés ici (pas d'API lancée),
      # ils sont exécutés dans le job e2e ci-dessous.
      - name: Tests unitaires et API
        run: pytest -v -m "not e2e" --junitxml=reports/junit.xml

      - name: Rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: reports/junit.xml

      - name: Modèle entraîné
        uses: actions/upload-artifact@v4
        with:
          name: model
          path: models/

  # 2. Build de l'image Docker + smoke test du conteneur
  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker
        run: docker build -t ml-churn-api:${{ github.sha }} .

      - name: Smoke test du conteneur
        run: |
          docker run -d --name api -p 8000:8000 ml-churn-api:${{ github.sha }}
          for i in $(seq 1 30); do
            curl -fs http://localhost:8000/health && break
            sleep 2
          done
          curl -fs http://localhost:8000/health
          curl -fs -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"age":35,"anciennete":5,"revenu":450000,"nb_reclamations":2,"montant_mensuel":25000,"retards_paiement":2}'

      - name: Logs du conteneur
        if: always()
        run: docker logs api

  # 3. Tests E2E Selenium sur l'application conteneurisée
  e2e:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installation
        run: pip install -r requirements-dev.txt

      - name: Démarrage de l'API
        run: |
          docker compose up -d --build --wait api

      - name: Tests Selenium (Chrome headless)
        env:
          E2E_BASE_URL: http://localhost:8000
          E2E_REQUIRED: "1"
        run: pytest tests/test_selenium.py -v

      - name: Arrêt
        if: always()
        run: |
          docker compose logs api
          docker compose down -v

  # 4. Déploiement continu sur la VM (uniquement sur main, si les secrets sont configurés)
  #    Secrets GitHub à créer : VM_HOST (IP publique), VM_USER (ex. ubuntu), VM_SSH_KEY (clé privée)
  deploy:
    needs: e2e
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_USER: ${{ secrets.VM_USER }}
    steps:
      - name: Vérification des secrets
        id: check
        run: |
          if [ -z "$VM_HOST" ]; then
            echo "Aucune VM configurée (secret VM_HOST absent) : déploiement ignoré."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Déploiement par SSH
        if: steps.check.outputs.enabled == 'true'
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/id_vm && chmod 600 ~/.ssh/id_vm
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_vm "$VM_USER@$VM_HOST" "/opt/ml-churn/deploy/deploy.sh main"

      - name: Vérification publique
        if: steps.check.outputs.enabled == 'true'
        run: curl -fs "http://$VM_HOST:8000/health"
